services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_db"]
      interval: 2s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/wallet_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: postgres:15-alpine
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./seed.sql:/seed.sql
    depends_on:
      app:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for app to create schema..."
        sleep 5
        psql -h db -U postgres -d wallet_db -f /seed.sql || true
        echo "Seed step finished."

volumes:
  pgdata:
